services:

  mysql:
    image: mysql:8.0
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: nats
      MYSQL_DATABASE: employee

  employee-management:
    image: natchathra14/employee-management:latest
    container_name: employee-app

    restart: always

    ports:
      - "8080:8080"

    depends_on:
      - mysql